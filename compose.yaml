name: ai-token-gateway

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME:-ai_token_gateway}
      APP_DB_USER: ${APP_DB_USER:-gateway_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      LITELLM_DB_NAME: ${LITELLM_DB_NAME:-ai_token_proxy}
      LITELLM_DB_USER: ${LITELLM_DB_USER:-gateway_proxy}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/10-create-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    networks: [app-data, proxy-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U gateway_bootstrap -d postgres"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    entrypoint: ["/bin/sh", "/run/gateway/redis-start.sh"]
    volumes:
      - redis_data:/data
      - ./deploy/redis/start.sh:/run/gateway/redis-start.sh:ro
    networks: [app-data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:v1.111.0
    command: ["--config", "/app/gateway.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:?Set LITELLM_DATABASE_URL in .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set LITELLM_SALT_KEY in .env}
      LITELLM_TELEMETRY: "False"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      APP_GATEWAY_CALLBACK_BASE_URL: http://backend:8000
      APP_GATEWAY_CALLBACK_SECRET: ${APP_GATEWAY_CALLBACK_SECRET:-}
    volumes:
      - ./deploy/litellm/config.yaml:/app/gateway.yaml:ro
      - ./deploy/litellm/gateway_callback.py:/app/gateway_callback.py:ro
    networks: [gateway, proxy-data]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    command: ["/bin/sh", "-ec", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    environment:
      APP_DB_HOST: postgres
      APP_DB_PORT: "5432"
      FORWARDED_ALLOW_IPS: ${APP_TRUSTED_FORWARDERS:-127.0.0.1}
      APP_DB_NAME: ${APP_DB_NAME:-ai_token_gateway}
      APP_DB_USER: ${APP_DB_USER:-gateway_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      APP_ENTERPRISE_TIMEZONE: ${APP_ENTERPRISE_TIMEZONE:-Asia/Shanghai}
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_LITELLM_URL: http://litellm:4000
      APP_LITELLM_ADMIN_KEY: ${APP_LITELLM_ADMIN_KEY:-}
      APP_LITELLM_SERVICE_KEY: ${APP_LITELLM_SERVICE_KEY:-}
      APP_GATEWAY_INPUT_BOUNDS: ${APP_GATEWAY_INPUT_BOUNDS:-}
      APP_GATEWAY_RESPONSES_ENABLED: ${APP_GATEWAY_RESPONSES_ENABLED:-false}
      APP_GATEWAY_OUTPUT_LIMIT: ${APP_GATEWAY_OUTPUT_LIMIT:-1024}
      APP_GATEWAY_RPM: ${APP_GATEWAY_RPM:-60}
      APP_GATEWAY_TPM: ${APP_GATEWAY_TPM:-200000}
      APP_GATEWAY_PARALLEL: ${APP_GATEWAY_PARALLEL:-4}
      APP_GATEWAY_DEADLINE: ${APP_GATEWAY_DEADLINE:-120}
      APP_GATEWAY_CALLBACK_SECRET: ${APP_GATEWAY_CALLBACK_SECRET:-}
      APP_SECURE_COOKIES: ${APP_SECURE_COOKIES:-true}
      APP_DOCS_ENABLED: ${APP_DOCS_ENABLED:-true}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_CORS_ORIGINS: '${APP_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
    networks: [edge, app-data, gateway]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.tasks.risk_worker"]
    restart: unless-stopped
    environment:
      APP_DB_HOST: postgres
      APP_DB_NAME: ${APP_DB_NAME:-ai_token_gateway}
      APP_DB_USER: ${APP_DB_USER:-gateway_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      APP_REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      APP_GATEWAY_DEADLINE: ${APP_GATEWAY_DEADLINE:-120}
      APP_RISK_INTERVAL: ${APP_RISK_INTERVAL:-30}
      APP_RISK_FREQUENCY: ${APP_RISK_FREQUENCY:-100}
      APP_RISK_HIGH_COST_USD: ${APP_RISK_HIGH_COST_USD:-10}
      APP_RISK_PROVIDER_ERRORS: ${APP_RISK_PROVIDER_ERRORS:-5}
      APP_RISK_INVALID_KEYS: ${APP_RISK_INVALID_KEYS:-10}
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-data]

  frontend:
    build:
      context: ./frontend
    networks: [edge]

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/inference.inc:/etc/nginx/inference.inc:ro
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

networks:
  edge:
  app-data:
    internal: true
  proxy-data:
    internal: true
  gateway:
    internal: true

volumes:
  postgres_data:
  redis_data:
