upstream gateway_backend {
    server backend:8000;
}

upstream gateway_frontend {
    server frontend:80;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 2m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /api/ {
        proxy_pass http://gateway_backend;
    }

    location ~ ^/(health(/(live|ready))?|docs(/oauth2-redirect)?|openapi\.json)$ {
        proxy_pass http://gateway_backend;
    }

    # All inference routes use FastAPI admission.
    location = /v1/models {
        include /etc/nginx/inference.inc;
    }

    location = /v1/responses {
        include /etc/nginx/inference.inc;
    }

    location = /v1/chat/completions {
        include /etc/nginx/inference.inc;
    }

    location = /v1/messages {
        include /etc/nginx/inference.inc;
    }

    location /v1/ {
        return 404;
    }

    location ~ ^/(internal|ui|key|model|user|team|spend)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://gateway_frontend;
    }
}
